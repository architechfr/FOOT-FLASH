name: Update livescores

# Mondial 2026 terminé : les fichiers publiés restent accessibles.
# Exécuter manuellement uniquement pour une correction des données.
on:
  workflow_dispatch:
    inputs:
      sync_prono_poto:
        description: "Répercuter les scores officiels dans Prono Poto"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-livescores
  cancel-in-progress: true

jobs:
  livescores:
    # Ignore un éventuel dernier auto-déclenchement de l'ancien workflow.
    if: ${{ github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Récupérer les scores et les compositions
        env:
          FOOTBALLDATA_KEY: ${{ secrets.FOOTBALLDATA_KEY }}
          APIFOOTBALL_KEY: ${{ secrets.APIFOOTBALL_KEY }}
          COMP: "WC"
        run: |
          node scripts/fetch-livescores.mjs
          node scripts/fetch-lineups.mjs
      - name: Publier les données modifiées
        run: |
          git add -- app/src/main/assets/data/livescores.json app/src/main/assets/data/schedule-fd.json app/src/main/assets/data/lineups.json app/src/main/assets/data/ko-bracket.json
          if git diff --cached --quiet; then
            echo "Aucune donnée modifiée."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Correction manuelle : scores du Mondial 2026"
            git push
          fi
      - name: Synchroniser les scores officiels vers Prono Poto
        if: ${{ inputs.sync_prono_poto }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: node scripts/push-scores-to-supabase.mjs
